; PlatformIO Project Configuration File for Greek Commercial Behind-the-Meter EMS
; Milestone M4: ESP32 3-Phase Firmware & Telemetry Architecture
; Target Board: ESP32 Dev Module (esp32dev)
; Framework: Arduino

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -O2

build_unflags =
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.0
    knolleary/PubSubClient @ ^2.8
